apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sentinel-agent-restricted-network
  namespace: mkaos
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sentinel-agent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mkaos-ingress
          podSelector:
            matchLabels:
              app.kubernetes.io/name: trusted-ingress
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mkaos
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ollama
      ports:
        - protocol: TCP
          port: 11434
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
