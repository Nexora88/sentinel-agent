# Permission Rules
# allowed          → can do without asking
# needs_approval   → must request approval first

default:
  require_approval: true

actions:
  read_code: allowed
  run_static_analysis: allowed
  create_report: allowed
  send_notification: needs_approval
  scan_website: allowed

  open_github_issue: needs_approval
  create_pull_request: needs_approval
  commit_changes: needs_approval
  push_to_remote: needs_approval
  modify_files: needs_approval
