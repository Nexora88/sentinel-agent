services:
  sentinel:
    build: .
    container_name: sentinel-agent
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    environment:
      - SEKA_EMBEDDINGS_PROVIDER=${SEKA_EMBEDDINGS_PROVIDER:-local-semantic}
      - SEKA_REQUIRE_SEMANTIC_EMBEDDINGS=${SEKA_REQUIRE_SEMANTIC_EMBEDDINGS:-true}
      - SEKA_LOCAL_EMBEDDING_MODEL_PATH=${SEKA_LOCAL_EMBEDDING_MODEL_PATH:-/app/models/embeddings/paraphrase-multilingual-MiniLM-L12-v2}
      - SEKA_LOCAL_EMBEDDING_MANIFEST=${SEKA_LOCAL_EMBEDDING_MANIFEST:-/app/models/embeddings/embedding-manifest.json}
      - SEKA_EMBEDDING_DEVICE=${SEKA_EMBEDDING_DEVICE:-cpu}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - MKAOS_BASE_URL=${MKAOS_BASE_URL:-http://mkaos:11435}
      - MKAOS_CHAT_BACKEND=${MKAOS_CHAT_BACKEND:-native-rust}
      - MKAOS_NATIVE_GENERATOR=${MKAOS_NATIVE_GENERATOR:-/usr/local/bin/mkaos-generate}
      - MKAOS_NATIVE_CHECKPOINT=${MKAOS_NATIVE_CHECKPOINT:-/app/models/mkaos/model.mkaosw}
      - MKAOS_NATIVE_SHA256=${MKAOS_NATIVE_SHA256:-}
      - MKAOS_NATIVE_HEADS=${MKAOS_NATIVE_HEADS:-4}
      - MKAOS_NATIVE_KV_HEADS=${MKAOS_NATIVE_KV_HEADS:-2}
      - MKAOS_NATIVE_MAX_SEQ=${MKAOS_NATIVE_MAX_SEQ:-2048}
      - MKAOS_NATIVE_MAX_NEW_TOKENS=${MKAOS_NATIVE_MAX_NEW_TOKENS:-256}
      - MKAOS_NATIVE_TIMEOUT_SECONDS=${MKAOS_NATIVE_TIMEOUT_SECONDS:-90}
      - MKAOS_MODEL_NAME=${MKAOS_MODEL_NAME:-mkaos-local}
      - MKAOS_REPETITION_PENALTY=${MKAOS_REPETITION_PENALTY:-1.10}
      - MKAOS_TEMPERATURE=${MKAOS_TEMPERATURE:-0.15}
      - MKAOS_TOP_P=${MKAOS_TOP_P:-0.9}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - WHATSAPP_PHONE=${WHATSAPP_PHONE:-}
      - WHATSAPP_APIKEY=${WHATSAPP_APIKEY:-}
      - OWNER_PASSWORD=${OWNER_PASSWORD:-}
      - AUTH_REQUIRED=${AUTH_REQUIRED:-true}
      - REQUIRE_APPROVAL=${REQUIRE_APPROVAL:-true}
      - ALLOW_WEB_RESEARCH=${ALLOW_WEB_RESEARCH:-false}
      - ALLOW_EXTERNAL_FINANCE_DATA=${ALLOW_EXTERNAL_FINANCE_DATA:-false}
      - ALLOW_SITE_SCANNING=${ALLOW_SITE_SCANNING:-false}
      - ALLOW_EXTERNAL_NOTIFICATIONS=${ALLOW_EXTERNAL_NOTIFICATIONS:-false}
      - MKAOS_NETWORK_MODE=${MKAOS_NETWORK_MODE:-offline}
      - ALLOW_LIVE_WEATHER=${ALLOW_LIVE_WEATHER:-false}
      - ALLOW_LIVE_TRAFFIC=${ALLOW_LIVE_TRAFFIC:-false}
      - TOMTOM_API_KEY=${TOMTOM_API_KEY:-}
      - ALLOW_BILLING=${ALLOW_BILLING:-false}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PRICE_ID=${STRIPE_PRICE_ID:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - MKAOS_PUBLIC_BASE_URL=${MKAOS_PUBLIC_BASE_URL:-https://localhost}
      - MKAOS_BILLING_STATE_PATH=${MKAOS_BILLING_STATE_PATH:-/app/memory/billing.sqlite3}
      - SEKA_RAG_MAX_DOCUMENTS=${SEKA_RAG_MAX_DOCUMENTS:-10000}
      - SEKA_RAG_MAX_CHUNKS_PER_INGEST=${SEKA_RAG_MAX_CHUNKS_PER_INGEST:-500}
      - SEKA_RAG_MAX_CHARS_PER_INGEST=${SEKA_RAG_MAX_CHARS_PER_INGEST:-1000000}
      - SEKA_NIGHT_AUTORUN=${SEKA_NIGHT_AUTORUN:-true}
      - SEKA_NIGHT_HOUR=${SEKA_NIGHT_HOUR:-3}
      - SEKA_NIGHT_MINUTE=${SEKA_NIGHT_MINUTE:-0}
      - SEKA_TIMEZONE=${SEKA_TIMEZONE:-Europe/Istanbul}
      - SEKA_NIGHT_RUN_TESTS=${SEKA_NIGHT_RUN_TESTS:-true}
      - SEKA_NIGHT_CHECK_TIMEOUT_SECONDS=${SEKA_NIGHT_CHECK_TIMEOUT_SECONDS:-180}
      - ANONYMIZED_TELEMETRY=False
      - CHROMA_TELEMETRY=False
      - LANGCHAIN_TRACING_V2=false
      - LANGSMITH_TRACING=false
      - OTEL_SDK_DISABLED=true
      - WEB_PORT=8000
      - PIPER_EXECUTABLE=${PIPER_EXECUTABLE:-piper}
      - SEKA_VOICE_MODEL_DIR=${SEKA_VOICE_MODEL_DIR:-/app/models/voices}
      - SEKA_VOICE_MALE_MODEL=${SEKA_VOICE_MALE_MODEL:-tr_TR-fettah-medium.onnx}
      - SEKA_VOICE_FEMALE_MODEL=${SEKA_VOICE_FEMALE_MODEL:-tr_TR-dfki-medium.onnx}
      - FASTER_WHISPER_MODEL_PATH=${FASTER_WHISPER_MODEL_PATH:-/app/models/whisper-small}
      - WHISPER_CPP_BIN=${WHISPER_CPP_BIN:-whisper-cli}
      - WHISPER_MODEL_PATH=${WHISPER_MODEL_PATH:-}
      - SD_API_URL=${SD_API_URL:-}
      - U2NET_HOME=${U2NET_HOME:-/app/models/u2net}
    volumes:
      - sentinel_memory:/app/memory
      - ./models:/app/models:ro
      - ./config:/app/config:ro
    networks:
      - seka_isolated
    restart: unless-stopped
    command: ["python", "-m", "scripts.run", "web", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\", timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # MKAOS is required for chat generation; there is no Ollama chat rollback flag.
  mkaos:
    profiles: ["legacy-third-party-chat"]
    build:
      context: .
      dockerfile: Dockerfile.mkaos
    container_name: sentinel-mkaos
    environment:
      MKAOS_ALLOW_PRIVATE_BIND: "true"
      MKAOS_REPETITION_PENALTY: ${MKAOS_REPETITION_PENALTY:-1.10}
      MKAOS_TEMPERATURE: ${MKAOS_TEMPERATURE:-0.15}
      MKAOS_TOP_P: ${MKAOS_TOP_P:-0.9}
    volumes:
      - ./models/smollm2-135m-instruct:/models:ro
    expose:
      - "11435"
    networks:
      - seka_isolated
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:11435/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 120s

  # Optional legacy embedding provider; not started unless its profile is enabled.
  ollama:
    profiles: ["legacy-ollama-embeddings"]
    image: ollama/ollama:0.12.6
    container_name: seka-ollama
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    networks:
      - seka_isolated

networks:
  seka_isolated:
    internal: true

volumes:
  ollama_models:
    name: seka_ollama_models
  sentinel_memory:
    driver: local
