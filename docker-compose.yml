services:
  sentinel:
    build: .
    container_name: sentinel-agent
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - OLLAMA_MODEL_FAST=${OLLAMA_MODEL_FAST:-qwen2.5:7b}
      - OLLAMA_MODEL_DEEP=${OLLAMA_MODEL_DEEP:-qwen2.5-coder:7b}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - WHATSAPP_PHONE=${WHATSAPP_PHONE:-}
      - WHATSAPP_APIKEY=${WHATSAPP_APIKEY:-}
      - OWNER_PASSWORD=${OWNER_PASSWORD:-}
      - AUTH_REQUIRED=${AUTH_REQUIRED:-true}
      - REQUIRE_APPROVAL=${REQUIRE_APPROVAL:-true}
      - ALLOW_WEB_RESEARCH=${ALLOW_WEB_RESEARCH:-false}
      - ALLOW_EXTERNAL_FINANCE_DATA=${ALLOW_EXTERNAL_FINANCE_DATA:-false}
      - ALLOW_SITE_SCANNING=${ALLOW_SITE_SCANNING:-false}
      - ALLOW_EXTERNAL_NOTIFICATIONS=${ALLOW_EXTERNAL_NOTIFICATIONS:-false}
      - SEKA_RAG_MAX_DOCUMENTS=${SEKA_RAG_MAX_DOCUMENTS:-10000}
      - SEKA_RAG_MAX_CHUNKS_PER_INGEST=${SEKA_RAG_MAX_CHUNKS_PER_INGEST:-500}
      - SEKA_RAG_MAX_CHARS_PER_INGEST=${SEKA_RAG_MAX_CHARS_PER_INGEST:-1000000}
      - SEKA_NIGHT_AUTORUN=${SEKA_NIGHT_AUTORUN:-true}
      - SEKA_NIGHT_HOUR=${SEKA_NIGHT_HOUR:-3}
      - SEKA_NIGHT_MINUTE=${SEKA_NIGHT_MINUTE:-0}
      - SEKA_TIMEZONE=${SEKA_TIMEZONE:-Europe/Istanbul}
      - SEKA_NIGHT_RUN_TESTS=${SEKA_NIGHT_RUN_TESTS:-true}
      - SEKA_NIGHT_CHECK_TIMEOUT_SECONDS=${SEKA_NIGHT_CHECK_TIMEOUT_SECONDS:-180}
      - ANONYMIZED_TELEMETRY=False
      - CHROMA_TELEMETRY=False
      - LANGCHAIN_TRACING_V2=false
      - LANGSMITH_TRACING=false
      - OTEL_SDK_DISABLED=true
      - WEB_PORT=8000
      - PIPER_EXECUTABLE=${PIPER_EXECUTABLE:-piper}
      - SEKA_VOICE_MODEL_DIR=${SEKA_VOICE_MODEL_DIR:-/app/models/voices}
      - SEKA_VOICE_MALE_MODEL=${SEKA_VOICE_MALE_MODEL:-tr_TR-fettah-medium.onnx}
      - SEKA_VOICE_FEMALE_MODEL=${SEKA_VOICE_FEMALE_MODEL:-tr_TR-dfki-medium.onnx}
      - FASTER_WHISPER_MODEL_PATH=${FASTER_WHISPER_MODEL_PATH:-/app/models/whisper-small}
      - WHISPER_CPP_BIN=${WHISPER_CPP_BIN:-whisper-cli}
      - WHISPER_MODEL_PATH=${WHISPER_MODEL_PATH:-}
      - SD_API_URL=${SD_API_URL:-}
      - U2NET_HOME=${U2NET_HOME:-/app/models/u2net}
    volumes:
      # Persistent local knowledge and memory. Keep this volume backed up.
      - sentinel_memory:/app/memory
      - ./models:/app/models:ro
      - ./config:/app/config:ro
    networks:
      - seka_isolated
    restart: unless-stopped
    command: ["python", "-m", "scripts.run", "web", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(\u0022http://127.0.0.1:8000/health\u0022, timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: seka-ollama
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    networks:
      - seka_isolated

networks:
  seka_isolated:
    internal: true

volumes:
  ollama_models:
    name: seka_ollama_models
  sentinel_memory:
    driver: local
