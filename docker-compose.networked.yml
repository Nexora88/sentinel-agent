# Explicit opt-in runtime network profile.
# Network access alone does not enable integrations; each ALLOW_* setting remains false by default.
services:
  sentinel:
    environment:
      ALLOW_WEB_RESEARCH: ${ALLOW_WEB_RESEARCH:-false}
      ALLOW_EXTERNAL_FINANCE_DATA: ${ALLOW_EXTERNAL_FINANCE_DATA:-false}
      ALLOW_SITE_SCANNING: ${ALLOW_SITE_SCANNING:-false}
      ALLOW_EXTERNAL_NOTIFICATIONS: ${ALLOW_EXTERNAL_NOTIFICATIONS:-false}
      MKAOS_NETWORK_MODE: networked
      ALLOW_LIVE_WEATHER: ${ALLOW_LIVE_WEATHER:-false}
      ALLOW_LIVE_TRAFFIC: ${ALLOW_LIVE_TRAFFIC:-false}
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:-}
      ALLOW_BILLING: ${ALLOW_BILLING:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      MKAOS_PUBLIC_BASE_URL: ${MKAOS_PUBLIC_BASE_URL:-https://localhost}
      MKAOS_BILLING_STATE_PATH: ${MKAOS_BILLING_STATE_PATH:-/app/memory/billing.sqlite3}
    networks:
      - seka_isolated
  ollama:
    networks:
      - seka_isolated
networks:
  seka_isolated:
    internal: false
