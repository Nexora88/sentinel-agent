name: MKAOS Hugging Face CPU reference smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/mkaos_hf_cpu_smoke.py"
      - "tools/mkaos_numerical_parity.py"
      - "tests/test_mkaos_numerical_parity.py"
      - "docs/MKAOS_HF_COMPATIBILITY_MATRIX.md"
      - ".github/workflows/mkaos-hf-cpu-smoke.yml"

permissions:
  contents: read

jobs:
  hf-reference-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.49.0 safetensors==0.5.3
      - name: Test numerical comparison utility
        run: python -m unittest discover -s tests -p test_mkaos_numerical_parity.py -v
      - name: Load pinned model, compare repeat logits, and save reference fixture
        run: |
          python tools/mkaos_hf_cpu_smoke.py \
            --output artifacts/mkaos-hf-cpu-smoke.json \
            --logits-output artifacts/mkaos-hf-reference-logits.npz
      - name: Publish metrics and reference logits
        uses: actions/upload-artifact@v4
        with:
          name: mkaos-hf-cpu-reference-smoke
          path: |
            artifacts/mkaos-hf-cpu-smoke.json
            artifacts/mkaos-hf-reference-logits.npz
          if-no-files-found: error
