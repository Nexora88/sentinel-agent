name: MKAOS container integration checks

on:
  pull_request:
    paths:
      - "Dockerfile.mkaos"
      - "docker-compose.yml"
      - "docker-compose.offline.yml"
      - "docker-compose.mkaos-local-test.yml"
      - "core/ollama_client.py"
      - "engine/mkaos-hf-adapter/src/bin/mkaos_server.rs"
      - ".github/workflows/mkaos-container-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Validate strict offline Compose overlay
        run: docker compose --file docker-compose.yml --file docker-compose.offline.yml --profile mkaos config --quiet
      - name: Validate loopback-only MKAOS test overlay
        run: docker compose --file docker-compose.yml --file docker-compose.mkaos-local-test.yml --profile mkaos config --quiet
      - name: Build resident MKAOS image
        run: docker build --file Dockerfile.mkaos --tag mkaos-resident:ci .
