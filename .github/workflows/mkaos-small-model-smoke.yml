name: MKAOS small-model train-save-reload smoke

on:
  push:
    branches: [feat/native-turkish-model-recovery]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tiny-native-model-roundtrip:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'feat/native-turkish-model-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install CPU-only training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Audit the first-party smoke corpus
        run: |
          python -m unittest discover -s tests -p test_audit_mkaos_corpus.py -v
          python tools/audit_mkaos_corpus.py \
            --corpus data/mkaos/first-party-smoke-v1.jsonl \
            --manifest data/mkaos/first-party-smoke-v1.manifest.json \
            --experimental-local-only \
            --output /tmp/mkaos-corpus-audit.json
      - name: Train tiny model from random initialization and persist checkpoint
        run: |
          set -eu
          mkdir -p artifacts/mkaos-local-experiment
          python tools/train_mkaos_from_scratch.py \
            --corpus data/mkaos/first-party-smoke-v1.jsonl \
            --manifest data/mkaos/first-party-smoke-v1.manifest.json \
            --source-register data/mkaos/source-register.json \
            --output-dir artifacts/mkaos-local-experiment \
            --experimental-local-only \
            --epochs 3 --batch-size 2 --sequence-length 64 \
            --hidden-size 32 --layers 1 --heads 4 --kv-heads 2 \
            --intermediate-size 64 --seed 20261016
          python tools/verify_mkaos_training_artifacts.py artifacts/mkaos-local-experiment/training-report.json
      - name: Build native Rust inference CLI
        run: cargo build --manifest-path engine/mkaos-inference/Cargo.toml --bin mkaos-run
      - name: Reload exact saved checkpoint and verify one-token generation
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          out = Path("artifacts/mkaos-local-experiment")
          report = json.loads((out / "training-report.json").read_text(encoding="utf-8"))
          checkpoint = out / report["checkpoint_file"]
          digest = hashlib.sha256(checkpoint.read_bytes()).hexdigest()
          assert digest == report["checkpoint_sha256"], "saved checkpoint hash mismatch"
          command = [
              "engine/mkaos-inference/target/debug/mkaos-run",
              "--checkpoint", str(checkpoint), "--sha256", digest,
              "--heads", "4", "--kv-heads", "2", "--max-seq-len", "64",
              "--max-new-tokens", "1", "--prompt", "MKAOS", "--raw-token-ids",
          ]
          result = subprocess.run(command, text=True, capture_output=True)
          if result.returncode:
              raise SystemExit("Rust checkpoint reload/generation failed:\n" + result.stderr[-4000:])
          if "checkpoint_sha256=" + digest not in result.stderr:
              raise SystemExit("Rust runtime did not confirm the saved checkpoint hash")
          print("PASS: tiny model trained, checkpoint persisted, hash verified, and reloaded by native Rust inference.")
          print(result.stderr[-2000:])
          PY
      - name: Remove local-only model weights from workspace
        if: always()
        run: rm -f artifacts/mkaos-local-experiment/mkaos-owned.mkaosw artifacts/mkaos-local-experiment/tokenizer.json
