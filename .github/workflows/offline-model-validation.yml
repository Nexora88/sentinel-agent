name: Pinned model offline inference validation

on:
  pull_request:
    paths:
      - "tools/ci_offline_smollm2_validation.py"
      - ".github/workflows/offline-model-validation.yml"
      - "models/smollm2-135m-instruct/model-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-model-smoke:
    name: Hashes, tokenizer/runtime compatibility, offline generation, metrics
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU inference runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.48.3" "huggingface_hub==0.28.1" "safetensors>=0.4.5" "psutil>=5.9" "accelerate>=1.2"

      - name: Verify pinned artifacts and run real inference offline
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python tools/ci_offline_smollm2_validation.py

      - name: Upload metrics report (no model weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-model-validation-report
          path: offline-model-report.json
          if-no-files-found: warn
          retention-days: 14
