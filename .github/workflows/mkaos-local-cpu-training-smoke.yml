name: MKAOS Local CPU Training + Rust Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tiny-cpu-train-and-rust-load:
    name: Tiny CPU-only training and Rust checkpoint compatibility (not quality)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Train a tiny model from random initialization
        run: |
          set -eu
          mkdir -p artifacts/mkaos-local-experiment
          python tools/train_mkaos_from_scratch.py \
            --corpus data/mkaos/first-party-smoke-v1.jsonl \
            --manifest data/mkaos/first-party-smoke-v1.manifest.json \
            --source-register data/mkaos/source-register.json \
            --output-dir artifacts/mkaos-local-experiment \
            --experimental-local-only \
            --epochs 3 --batch-size 2 --sequence-length 64 \
            --hidden-size 32 --layers 1 --heads 4 --kv-heads 2 \
            --intermediate-size 64 --seed 20261016
          python tools/verify_mkaos_training_artifacts.py artifacts/mkaos-local-experiment/training-report.json
      - name: Build Rust inference CLI
        run: cargo build --manifest-path engine/mkaos-inference/Cargo.toml --bin mkaos-run
      - name: Verify Rust loads the exact checkpoint and matches its SHA-256
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          out = Path("artifacts/mkaos-local-experiment")
          report = json.loads((out / "training-report.json").read_text(encoding="utf-8"))
          checkpoint = out / "mkaos-owned.mkaosw"
          digest = hashlib.sha256(checkpoint.read_bytes()).hexdigest()
          if digest != report["checkpoint_sha256"]:
              raise SystemExit("Checkpoint hash differs from training report")
          result = subprocess.run([
              "engine/mkaos-inference/target/debug/mkaos-run",
              "--checkpoint", str(checkpoint), "--sha256", digest,
              "--heads", "4", "--kv-heads", "2", "--max-seq-len", "64",
              "--max-new-tokens", "1", "--prompt", "MKAOS", "--raw-token-ids"
          ], text=True, capture_output=True)
          if result.returncode:
              raise SystemExit("Rust checkpoint load/inference failed: " + result.stderr[-3000:])
          if f"checkpoint_sha256={digest}" not in result.stderr:
              raise SystemExit("Rust loader did not report the expected checkpoint SHA-256")
          print("PASS: Rust loaded the exact tiny checkpoint and reported the expected SHA-256.")
          print("LIMIT: This does not establish Turkish quality or an Ankara answer.")
          PY
      - name: Remove model weights; publish metrics only
        if: always()
        run: |
          rm -f artifacts/mkaos-local-experiment/mkaos-owned.mkaosw
          rm -f artifacts/mkaos-local-experiment/tokenizer.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mkaos-local-cpu-training-report
          path: artifacts/mkaos-local-experiment/training-report.json
          if-no-files-found: ignore
