name: MKAOS technical archive audit tests

on:
  pull_request:
    paths:
      - "scripts/mkaos/audit_technical_archive.py"
      - "tests/test_mkaos_technical_archive.py"
      - ".github/workflows/mkaos-technical-skills-tests.yml"
  push:
    branches:
      - mkaos/technical-skills-data-pipeline
    paths:
      - "scripts/mkaos/audit_technical_archive.py"
      - "tests/test_mkaos_technical_archive.py"
      - ".github/workflows/mkaos-technical-skills-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run technical archive audit unit tests
        run: python -m unittest discover -s tests -p "test_mkaos_technical_archive.py" -v
