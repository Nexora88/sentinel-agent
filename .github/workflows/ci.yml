name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-unit-tests:
    name: Portable unit tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test portable hardware profile and integration policy
        run: |
          python -m unittest discover -s tests -p test_runtime_profile.py -v
          python -m unittest discover -s tests -p test_hardware_backends.py -v
          python -m unittest discover -s tests -p test_reasoning_engine.py -v
          python -m unittest discover -s tests -p test_integration_catalog.py -v
          python -m unittest discover -s tests -p test_tenant_storage.py -v
          python -m unittest discover -s tests -p test_job_bus_tenant_isolation.py -v
          python -m unittest discover -s tests -p test_offline_egress_contract.py -v
          python -m unittest discover -s tests -p test_egress_policy.py -v
          python -m unittest discover -s tests -p test_turkish_quality_contract.py -v
          python -m unittest discover -s tests -p test_validate_mkaos_source_register.py -v
          python -m unittest discover -s tests -p test_mkaos_corpus_gate.py -v

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q agents core scripts tools web
      - name: Validate MKAOS bootstrap shell syntax
        run: bash -n scripts/mkaos_bootstrap.sh
      - name: Test local semantic embedding integrity gate
        run: python -m unittest discover -s tests -p test_local_semantic_embeddings.py -v
      - name: Test MKAOS hardware and throughput diagnostics
        run: python -m unittest discover -s tests -p test_mkaos_diagnostics.py -v
      - name: Test native MKAOS Rust inference engine and CLI
        run: cargo test --manifest-path engine/mkaos-inference/Cargo.toml --all-targets
      - name: Smoke-test reproducible MKAOS release CPU benchmark
        run: cargo run --release --manifest-path engine/mkaos-inference/Cargo.toml --example mkaos_cpu_bench -- 1 3
      - name: Validate source register fail-closed policy
        run: python tools/validate_mkaos_source_register.py
      - name: Test MKAOS data audit, Turkish evaluation, and media adapters
        run: |
          python -m unittest discover -s tests -p 'test_audit_mkaos_corpus.py' -v
          python -m unittest discover -s tests -p 'test_mkaos_turkish_eval_pipeline.py' -v
          python -m unittest discover -s tests -p 'test_local_vision_adapter.py' -v
          python -m unittest discover -s tests -p 'test_local_video_adapters.py' -v
          python -m unittest discover -s tests -p 'test_mkaos_device_benchmark.py' -v
      - name: Test MKAOS tokenizer contract and artifact hash verification
        run: |
          python -m unittest discover -s tests -p 'test_mkaos_tokenizer_contract.py' -v
          python -m unittest discover -s tests -p 'test_verify_mkaos_training_artifacts.py' -v
          python -m unittest discover -s tests -p 'test_mkaos_training_manifest.py' -v
      - name: Check frontend JavaScript syntax
        run: node --check web/static/app.js
      - name: Validate Docker Compose profiles
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.offline.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.networked.yml config --quiet
          docker compose -f docker-compose.bootstrap.yml config --quiet
          docker compose -f docker-compose.browser.yml --profile browser-lab config --quiet
      - name: Build container image
        run: docker build --tag seka-agent-ci .
      - name: Smoke-test web startup without Ollama
        run: |
          set -eu
          docker run -d --name seka-web-smoke -p 127.0.0.1:18000:8000 -e AUTH_REQUIRED=true seka-agent-ci
          trap 'docker rm -f seka-web-smoke >/dev/null 2>&1 || true' EXIT
          healthy=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/health; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            docker logs seka-web-smoke
            exit 1
          fi
          bootstrap_secret="$(docker exec seka-web-smoke cat /app/memory/first-run-password.txt)"
          token="$(curl --fail --silent -X POST http://127.0.0.1:18000/api/login -H 'Content-Type: application/json' -d "{\"username\":\"owner\",\"password\":\"$bootstrap_secret\"}" | python -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
          status="$(curl --fail --silent -H "Authorization: Bearer $token" http://127.0.0.1:18000/api/status)"
          printf '%s' "$status" | python -c 'import json,sys; d=json.load(sys.stdin); assert d["status"] == "ok", d; assert d["ollama"]["status"] == "unavailable", d.get("ollama"); assert "rag" in d, d; print("Pipeline initializes; panel stays healthy and reports Ollama outage gracefully.")'
      - name: Test fail-closed native Rust chat adapter
        run: python -m unittest discover -s tests -p test_mkaos_native_chat.py -v
      - name: Run security regression tests
        run: python -m unittest discover -s tests -v
      - name: Benchmark native Turkish retrieval smoke set
        env:
          SEKA_EMBEDDINGS_PROVIDER: mkaos-native
        run: python -m scripts.benchmark_mkaos_retrieval
      - name: Test offline provenance audit
        run: |
          python -m unittest discover -s tests -p test_mkaos_provenance_audit.py -v
          python tools/audit_mkaos_provenance.py --root . --output artifacts/mkaos-provenance-audit.json
      - name: Scan repository for likely hardcoded secrets
        run: |
          python - <<'PY'
          from tools.secret_scanner import SecretScanner
          findings = SecretScanner().scan_directory(".", max_files=2000)
          if findings:
              for finding in findings:
                  print(f"{finding['type']} at {finding['source']}:{finding['line']}")
              raise SystemExit("Potential hardcoded credentials found.")
          print("No likely hardcoded credentials found.")
          PY

  supply-chain-sbom:
    # Do not mint attestations from unmerged pull-request code.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate local CycloneDX SBOM
        run: python tools/generate_mkaos_sbom.py --requirements requirements.txt --output artifacts/mkaos-sbom.cdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkaos-sbom-cyclonedx
          path: artifacts/mkaos-sbom.cdx.json
          if-no-files-found: error
      - name: Attest SBOM provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/mkaos-sbom.cdx.json
  experimental-owned-model-smoke:
    name: Owner-approved local-only MKAOS training + Rust smoke
    if: github.event_name == 'pull_request' && (github.event.pull_request.head.ref == 'mkaos-owner-approved-local-training' || github.event.pull_request.head.ref == 'mkaos-scale-rag-hardware' || github.event.pull_request.head.ref == 'security/egress-pq-cpu-smoke-20261024')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NumPy for checkpoint serialization
        run: python -m pip install numpy
      - name: Install CPU-only PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Train tiny MKAOS model from random initialization
        run: |
          set -eu
          mkdir -p artifacts/mkaos-local-experiment
          python tools/train_mkaos_from_scratch.py \
            --corpus data/mkaos/first-party-smoke-v1.jsonl \
            --manifest data/mkaos/first-party-smoke-v1.manifest.json \
            --source-register data/mkaos/source-register.json \
            --output-dir artifacts/mkaos-local-experiment \
            --experimental-local-only \
            --epochs 3 --batch-size 2 --sequence-length 64 \
            --hidden-size 32 --layers 1 --heads 4 --kv-heads 2 \
            --intermediate-size 64 --seed 20261016
          python tools/verify_mkaos_training_artifacts.py artifacts/mkaos-local-experiment/training-report.json
      - name: Build owned Rust inference CLI
        run: cargo build --manifest-path engine/mkaos-inference/Cargo.toml --bin mkaos-run
      - name: Load exact checkpoint in Rust and record first-token, throughput, and RSS
        run: |
          set -eu
          python - <<'PY'
          import hashlib, json, re, resource, subprocess, time
          from pathlib import Path
          out = Path("artifacts/mkaos-local-experiment")
          training = json.loads((out / "training-report.json").read_text(encoding="utf-8"))
          checkpoint = out / "mkaos-owned.mkaosw"
          digest = hashlib.sha256(checkpoint.read_bytes()).hexdigest()
          if digest != training["checkpoint_sha256"]:
              raise SystemExit("Persisted checkpoint SHA-256 differs from training report")
          def run_model(new_tokens):
              command = [
                  "engine/mkaos-inference/target/debug/mkaos-run",
                  "--checkpoint", str(checkpoint),
                  "--sha256", digest,
                  "--heads", "4", "--kv-heads", "2",
                  "--max-seq-len", "64", "--max-new-tokens", str(new_tokens),
                  "--prompt", "MKAOS", "--raw-token-ids"
              ]
              started = time.perf_counter()
              result = subprocess.run(command, text=True, capture_output=True)
              wall_ms = (time.perf_counter() - started) * 1000
              if result.returncode != 0:
                  raise SystemExit("Rust inference failed: " + result.stderr[-3000:])
              values = {}
              for key in ("checkpoint_sha256", "elapsed_ms", "generated_tokens", "tokens_per_second"):
                  match = re.search(r"^" + re.escape(key) + r"=([^\r\n]+)$", result.stderr, re.M)
                  if match:
                      values[key] = match.group(1)
              if values.get("checkpoint_sha256") != digest:
                  raise SystemExit("Rust loader did not report the same checkpoint hash")
              return {"wall_clock_ms_including_process_and_load": round(wall_ms, 3), **values}
          first = run_model(1)
          throughput = run_model(8)
          peak_rss_kb = resource.getrusage(resource.RUSAGE_CHILDREN).ru_maxrss
          report = {
              "experiment": "MKAOS-TR-FromScratch-Experimental",
              "dataset_id": training["dataset_id"],
              "dataset_revision": training["dataset_revision"],
              "manifest_sha256": training["manifest_sha256"],
              "checkpoint_sha256": digest,
              "trained_from_random_initialization": training["trained_from_random_initialization"],
              "external_model_weights_used": training["external_model_weights_used"],
              "training_mode": training["training_mode"],
              "redistribution_allowed": training["redistribution_allowed"],
              "train_samples": training["split_sample_counts"]["train"],
              "validation_samples": training["split_sample_counts"]["validation"],
              "independent_test_samples": training["split_sample_counts"]["test"],
              "best_validation_loss": training["best_validation_loss"],
              "independent_test_loss": training["independent_test_loss"],
              "rust_loader_hash_matches": True,
              "rust_first_token_wall_latency_ms": first["wall_clock_ms_including_process_and_load"],
              "rust_first_token_generation_ms": int(first["elapsed_ms"]),
              "rust_8_token_wall_elapsed_ms": throughput["wall_clock_ms_including_process_and_load"],
              "rust_8_token_generation_tokens_per_second": float(throughput["tokens_per_second"]),
              "experiment_peak_child_rss_kb": peak_rss_kb,
              "quality_status": "not_established; 12 short diagnostic records are insufficient for general-purpose Turkish claims",
              "checkpoint_policy": "ephemeral in CI; weights are not uploaded or distributed",
              "legal_status": "local-only owner-authorized experiment; license_reviewed remains false; no redistribution rights asserted"
          }
          (out / "rust-smoke-report.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Remove non-redistributable checkpoint before artifact publication
        run: rm -f artifacts/mkaos-local-experiment/mkaos-owned.mkaosw artifacts/mkaos-local-experiment/tokenizer.json
      - name: Publish metrics only (never model weights)
        uses: actions/upload-artifact@v4
        with:
          name: mkaos-local-only-training-report
          path: |
            artifacts/mkaos-local-experiment/training-report.json
            artifacts/mkaos-local-experiment/rust-smoke-report.json
          if-no-files-found: error

  portable-arm64:
    name: Portable unit tests (Ubuntu ARM64, Python 3.12)
    # GitHub-hosted ARM64 runners are available for public repositories.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Verify real ARM64 host and run portability/data-gate tests
        run: |
          python -c "import platform; print('machine=' + platform.machine()); assert platform.machine().lower() in ('aarch64', 'arm64'), platform.machine()"
          python -m pytest -q tests/test_platform_profile.py tests/test_validate_mkaos_source_register.py
          python tools/validate_mkaos_source_register.py

