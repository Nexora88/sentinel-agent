name: Local-model autonomous CI repair

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: mkaos-local-repair-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  propose-repair:
    # Requires an explicitly opted-in, private/self-hosted runner with Ollama and Docker.
    # This workflow is defined on the default branch and never checks out or runs failed PR code
    # on the host; only the trusted executor launches tests in a no-network container.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.MKAOS_REPAIR_ENABLED == 'true'
    runs-on: [self-hosted, linux, mkaos-repair]
    timeout-minutes: 20
    steps:
      - name: Checkout trusted default-branch tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify local-only repair prerequisites
        env:
          SANDBOX_IMAGE: ${{ vars.MKAOS_REPAIR_SANDBOX_IMAGE }}
          MODEL: ${{ vars.MKAOS_REPAIR_MODEL }}
        run: |
          set -euo pipefail
          test -n "$MODEL"
          test -n "$SANDBOX_IMAGE"
          printf '%s' "$SANDBOX_IMAGE" | grep -Eq '^[^[:space:]@]+@sha256:[0-9a-f]{64}$'
          command -v docker
          command -v gh
          docker image inspect "$SANDBOX_IMAGE" >/dev/null
          gh auth status

      - name: Run test-first local-model repair
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MKAOS_OLLAMA_URL: ${{ vars.MKAOS_OLLAMA_URL }}
          MKAOS_REPAIR_MODEL: ${{ vars.MKAOS_REPAIR_MODEL }}
          MKAOS_REPAIR_SANDBOX_IMAGE: ${{ vars.MKAOS_REPAIR_SANDBOX_IMAGE }}
        run: python tools/ci_autorepair_agent.py

      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-repair-evidence-${{ github.event.workflow_run.id }}
          path: ci-repair-evidence.json
          if-no-files-found: ignore
          retention-days: 14
