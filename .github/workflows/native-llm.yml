name: MKAOS Native LLM Core

on:
  push:
    branches: [main]
    paths:
      - "mkaos-llm/**"
      - ".github/workflows/native-llm.yml"
  pull_request:
    paths:
      - "mkaos-llm/**"
      - ".github/workflows/native-llm.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-core:
    name: Rust core tests (stable)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check and test native runtime foundation
        working-directory: mkaos-llm
        run: |
          cargo fmt --all
          cargo test
          cargo clippy --all-targets
