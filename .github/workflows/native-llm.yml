name: MKAOS Native LLM Core

on:
  push:
    branches: [main]
    paths:
      - "mkaos-llm/**"
      - ".github/workflows/native-llm.yml"
  pull_request:
    paths:
      - "mkaos-llm/**"
      - ".github/workflows/native-llm.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-core:
    name: Rust core tests (stable)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format source in runner and test
        working-directory: mkaos-llm
        run: |
          cargo fmt --all
          cargo test
      - name: Upload formatted source for review
        uses: actions/upload-artifact@v4
        with:
          name: mkaos-llm-formatted-source
          path: mkaos-llm/src/lib.rs
