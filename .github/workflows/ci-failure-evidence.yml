name: CI failure evidence

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  capture-failure-evidence:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Deliberately use the default branch's trusted tooling; never check out
      # or execute code from the failed pull request in this privileged event.
      - name: Checkout trusted reporting tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Capture and redact failed-job logs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh run view "$RUN_ID" --repo "$GH_REPO" --log-failed 2>&1 \
            | python tools/ci_failure_report.py --run-id "$RUN_ID" --head-sha "$HEAD_SHA" \
            > artifacts/ci-failure-report.txt

      - name: Upload sanitized diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-evidence-${{ github.event.workflow_run.id }}
          path: artifacts/ci-failure-report.txt
          if-no-files-found: error
          retention-days: 14
