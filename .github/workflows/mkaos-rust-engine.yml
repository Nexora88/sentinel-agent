name: MKAOS Rust inference kernels

on:
  push:
    paths:
      - "engine/mkaos-inference/**"
      - ".github/workflows/mkaos-rust-engine.yml"
      - "tools/fetch_model.py"
      - "tools/convert_safetensors_to_mkaosw1.py"
      - "models/smollm2-135m-instruct/**"
  pull_request:
    paths:
      - "engine/mkaos-inference/**"
      - ".github/workflows/mkaos-rust-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-kernel-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check Python tool syntax
        run: python -m py_compile tools/fetch_model.py tools/convert_safetensors_to_mkaosw1.py
      - name: Run unit tests
        run: cargo test --manifest-path engine/mkaos-inference/Cargo.toml
