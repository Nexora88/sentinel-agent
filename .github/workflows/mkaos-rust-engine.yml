name: MKAOS Rust inference kernels

on:
  push:
    paths:
      - "engine/mkaos-inference/**"
      - "engine/mkaos-hf-adapter/**"
      - ".github/workflows/mkaos-rust-engine.yml"
      - "tools/fetch_model.py"
      - "tools/convert_safetensors_to_mkaosw1.py"
      - "tools/validate_tokenizer.py"
      - "tools/validate_model_logits.py"
      - "tools/benchmark_mkaos_vs_ollama.py"
      - "tools/evaluate_mkaos_quality.py"
      - "benchmarks/**"
      - ".github/workflows/mkaos-real-model-validation.yml"
      - "models/smollm2-135m-instruct/**"
  pull_request:
    paths:
      - "engine/mkaos-inference/**"
      - "engine/mkaos-hf-adapter/**"
      - ".github/workflows/mkaos-rust-engine.yml"
      - "tools/fetch_model.py"
      - "tools/convert_safetensors_to_mkaosw1.py"
      - "tools/validate_tokenizer.py"
      - "tools/validate_model_logits.py"
      - "tools/benchmark_mkaos_vs_ollama.py"
      - ".github/workflows/mkaos-real-model-validation.yml"
      - "models/smollm2-135m-instruct/**"
      - "benchmarks/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-kernel-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check Python tool syntax
        run: python -m py_compile tools/fetch_model.py tools/convert_safetensors_to_mkaosw1.py tools/validate_tokenizer.py tools/validate_model_logits.py tools/benchmark_mkaos_vs_ollama.py tools/evaluate_mkaos_quality.py tools/train_mkaos_rust_compatible.py tools/export_mkaos_rust_checkpoint.py tools/run_mkaos_owned_smoke.py
      - name: Run core unit tests
        run: cargo test --manifest-path engine/mkaos-inference/Cargo.toml
      - name: Run Hugging Face adapter tests
        run: cargo test --manifest-path engine/mkaos-hf-adapter/Cargo.toml
      - name: Install PyTorch for owned-weight smoke test
        run: python -m pip install --disable-pip-version-check torch
      - name: Train, export, and compare real logits through the Rust decoder
        run: python tools/run_mkaos_owned_smoke.py
