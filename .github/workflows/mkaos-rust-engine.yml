name: MKAOS Rust inference kernels

on:
  push:
    paths:
      - "engine/mkaos-inference/**"
      - ".github/workflows/mkaos-rust-engine.yml"
  pull_request:
    paths:
      - "engine/mkaos-inference/**"
      - ".github/workflows/mkaos-rust-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-kernel-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run unit tests
        run: cargo test --manifest-path engine/mkaos-inference/Cargo.toml
      - name: Check formatting
        run: cargo fmt --manifest-path engine/mkaos-inference/Cargo.toml --all -- --check
