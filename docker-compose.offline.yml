# Strict offline runtime overlay.
# Build/download images and pull model files BEFORE enabling this profile.
# Runtime services can communicate with each other but cannot reach the internet.
services:
  sentinel:
    environment:
      SEKA_EMBEDDINGS_PROVIDER: ${SEKA_EMBEDDINGS_PROVIDER:-local-semantic}
      SEKA_REQUIRE_SEMANTIC_EMBEDDINGS: ${SEKA_REQUIRE_SEMANTIC_EMBEDDINGS:-true}
      SEKA_LOCAL_EMBEDDING_MODEL_PATH: ${SEKA_LOCAL_EMBEDDING_MODEL_PATH:-/app/models/embeddings/paraphrase-multilingual-MiniLM-L12-v2}
      SEKA_LOCAL_EMBEDDING_MANIFEST: ${SEKA_LOCAL_EMBEDDING_MANIFEST:-/app/models/embeddings/embedding-manifest.json}
      OLLAMA_BASE_URL: http://ollama:11434
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      ALLOW_WEB_RESEARCH: "false"
      ALLOW_EXTERNAL_FINANCE_DATA: "false"
      ALLOW_SITE_SCANNING: "false"
      ALLOW_EXTERNAL_NOTIFICATIONS: "false"
      WHATSAPP_PHONE: ""
      WHATSAPP_APIKEY: ""
      SD_API_URL: ${SD_API_URL:-}
    networks:
      - offline_internal
  ollama:
    image: ollama/ollama:latest
    container_name: seka-ollama-offline
    volumes:
      - ollama_models:/root/.ollama
    ports: []
    networks:
      - offline_internal
    restart: unless-stopped

  # Keep the optional MKAOS service on the same isolated offline-only network
  # as the app when this overlay is used with --profile legacy-third-party-chat.
  mkaos:
    networks:
      - offline_internal

networks:
  seka_isolated:
    internal: true
  offline_internal:
    internal: true
volumes:
  ollama_models:
    name: seka_ollama_models
